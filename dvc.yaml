stages:
  clean:
    cmd: python -m src.data_cleaning
    deps:
      - src/data_cleaning.py
      - data/raw
    params:
      - clean
    outs:
      - data/processed/clean.parquet
    metrics:
      - reports/cleaning_report.json:
          cache: false

  validate:
    cmd: python -m src.data_validation
    deps:
      - src/data_validation.py
      - data/processed/clean.parquet
    metrics:
      - reports/validation_report.json:
          cache: false
    
  features:
    cmd: python -m src.features
    deps:
      - src/features.py
      - data/processed/clean.parquet
      - reports/validation_report.json
    outs:
      - data/processed/features.parquet
    metrics:
      - reports/features_report.json:
          cache: false

  split:
    cmd: python -m src.split
    deps:
      - src/split.py
      - data/processed/features.parquet
    params:
      - split
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet
    metrics:
      - reports/split_report.json:
          cache: false